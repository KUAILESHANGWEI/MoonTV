name: Upstream Source Sync

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: upstream-source-sync
  cancel-in-progress: false

env:
  UPSTREAM_REPO: samqin123/MoonTV

jobs:
  sync_latest_from_upstream:
    name: Sync upstream main and keep localized links
    runs-on: ubuntu-latest

    steps:
      - name: Checkout target repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Merge upstream main
        run: |
          git remote add upstream "https://github.com/${UPSTREAM_REPO}.git"
          git fetch upstream main
          git checkout main
          git merge --no-edit upstream/main

      - name: Reapply localized repository links
        run: |
          git ls-files -z | while IFS= read -r -d '' file; do
            case "$file" in
              .github/workflows/sync.yml|.github/workflows/sync-release-assets.yml|scripts/sync-release-assets.sh)
                continue
                ;;
            esac

            perl -0pi -e '
              s#https://ghfast\.top/raw\.githubusercontent\.com/(?:senshinya|samqin123)/MoonTV#https://raw.githubusercontent.com/KUAILESHANGWEI/MoonTV#g;
              s#https://raw\.githubusercontent\.com/(?:senshinya|samqin123)/MoonTV#https://raw.githubusercontent.com/KUAILESHANGWEI/MoonTV#g;
              s#https://github\.com/(?:senshinya|samqin123)/MoonTV#https://github.com/KUAILESHANGWEI/MoonTV#g;
              s#ghcr\.io/senshinya/moontv#ghcr.io/kuileshangwei/moontv#g;
              s#(?:senshinya|samqin123)/MoonTV#KUAILESHANGWEI/MoonTV#g;
            ' "$file"
          done

      - name: Commit and push changes
        run: |
          if git diff --quiet; then
            echo "No upstream changes to push."
            exit 0
          fi

          git add -A
          git commit -m "chore: sync upstream and keep localized links"
          git push origin HEAD:main
