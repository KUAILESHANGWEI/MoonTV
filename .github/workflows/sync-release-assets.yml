name: Sync Latest Upstream Release Assets

on:
  schedule:
    - cron: "30 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-latest-upstream-release-assets
  cancel-in-progress: false

jobs:
  sync_release_assets:
    name: Mirror latest upstream release assets
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      UPSTREAM_REPO: samqin123/MoonTV
      TARGET_REPO: ${{ github.repository }}

    steps:
      - name: Checkout target repo
        uses: actions/checkout@v4

      - name: Sync latest release assets
        run: bash scripts/sync-release-assets.sh
